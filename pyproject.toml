[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "celarpass_core"
version = "1.0.0"
description = "Core cryptography module for CelarPass"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "cryptography>=41.0.0",
    "argon2-cffi>=21.3.0",
    "requests>=2.28.0",
    "pydantic>=2.0.0",
    "pyotp>=2.8.0"
]

[tool.setuptools.packages.find]
include = ["celarpass_core*"]
